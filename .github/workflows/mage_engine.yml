name: Celsius Mage Engine Dispatcher

on:
  workflow_dispatch:
    inputs:
      puter_link: { description: 'Logic Constant', required: true, default: '1' }
      artist_name: { description: 'Artist', required: true, default: 'Pope Troy' }
      song_title: { description: 'Song', required: true, default: 'Pergamum' }
      producer: { description: 'Producer', required: true, default: 'Celsius Media Group' }
      user_command: { description: 'Prophetic Goal', required: true }

# Added explicit write permissions to clear the 403 errors
permissions:
  contents: write
  actions: write

jobs:
  run_circuit:
    name: "Execute UESP PRCE Master"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          # Uses your PAT for the initial handshake to prevent 128 error
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Studio Setup
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install requests groq

      - name: Execute Expert Master
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ARTIST: ${{ github.event.inputs.artist_name }}
          SONG: ${{ github.event.inputs.song_title }}
          USER_COMMAND: ${{ github.event.inputs.user_command }}
          MAGE_TIMESTAMP: ${{ github.event.repository.updated_at }}
        run: python mastering_logic.py

      - name: Push to Repository
        env:
          MY_PAT: ${{ secrets.GH_PAT }}
        run: |
          git config --global user.name "PopeTroy"
          git config --global user.email "bot@celsiusmediagroup.co.za"
          
          # Force the remote to use the PAT for authentication to bypass 403
          git remote set-url origin https://x-access-token:${MY_PAT}@github.com/PopeTroy/PopeTroy-Signature-Mage-console-Nano-scaling.git
          
          git add latest_session.json
          git add -f "*.mp3" || echo "No audio signal detected"
          
          # Commit only if changes exist to avoid empty commit errors
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Signature Master Published: ${{ github.event.inputs.song_title }}"
            git push origin main
          fi
